# AeroDrag Wheel — Zephyr / nRF Connect SDK config
# Board: XIAO BLE Sense (xiao_ble/nrf52840/sense) — IMU LSM6DS3TR-C onboard.

# BLE peripheral
CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_DEVICE_NAME="AeroDrag Wheel"
CONFIG_BT_MAX_CONN=2
CONFIG_BT_GATT_CLIENT=n
CONFIG_BT_GATT_DYNAMIC_DB=y

# IMU onboard LSM6DS3TR-C (su I2C interno). Il LSM6DS3TR-C è register-compatibile
# con la famiglia LSM6DSL; verifica il driver/Kconfig corretto per la tua versione
# di NCS (alcune board lo dichiarano già nella DTS — vedi README).
CONFIG_SENSOR=y
CONFIG_I2C=y
CONFIG_LSM6DSL=y

# Floating point + stampa %f nei log
CONFIG_FPU=y
CONFIG_CBPRINTF_FP_SUPPORT=y

# Stack
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048

# Logging
CONFIG_LOG=y
