# AeroDrag Wheel — Zephyr / nRF Connect SDK config

# BLE peripheral
CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_DEVICE_NAME="AeroDrag Wheel"
CONFIG_BT_MAX_CONN=2
CONFIG_BT_GATT_CLIENT=n
CONFIG_BT_GATT_DYNAMIC_DB=y

# IMU ICM-42688-P (driver sensor Zephyr, su SPI)
CONFIG_SENSOR=y
CONFIG_ICM42688=y
CONFIG_SPI=y

# Floating point + stampa %f nei log
CONFIG_FPU=y
CONFIG_CBPRINTF_FP_SUPPORT=y

# Stack main un po' più grande per il sampling loop
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048

# Logging
CONFIG_LOG=y
