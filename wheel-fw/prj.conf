# AeroDrag Wheel — Zephyr / nRF Connect SDK config (skeleton)

# BLE peripheral
CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_DEVICE_NAME="AeroDrag Wheel"
CONFIG_BT_MAX_CONN=2
CONFIG_BT_GATT_CLIENT=n

# GATT: notifiche per lo stream (0xBB01) e il risultato (0xBB02)
CONFIG_BT_GATT_DYNAMIC_DB=y

# Sensori / IMU ICM-42688-P (driver Zephyr)
CONFIG_SENSOR=y
CONFIG_ICM42688=y
CONFIG_SPI=y

# Floating point per il calcolo velocità/accelerazione
CONFIG_FPU=y

# Logging
CONFIG_LOG=y
