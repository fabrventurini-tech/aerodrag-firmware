name: Build firmware

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install ESP-IDF
        run: |
          sudo apt-get install -y git wget flex bison gperf python3 python3-pip \
            python3-venv cmake ninja-build ccache libffi-dev libssl-dev dfu-util \
            libusb-1.0-0
          git clone --branch v5.4.1 --depth 1 --recursive \
            https://github.com/espressif/esp-idf.git /opt/esp-idf
          /opt/esp-idf/install.sh esp32s3

      - name: Build firmware
        run: |
          . /opt/esp-idf/export.sh
          idf.py set-target esp32s3
          idf.py build

      - name: Rename binary
        run: |
          cp build/aerodrag_firmware.bin build/aerodrag_firmware_$(git rev-parse --short HEAD).bin

      - name: Upload firmware binary
        uses: actions/upload-artifact@v4
        with:
          name: aerodrag-firmware
          path: |
            build/aerodrag_firmware.bin
            build/aerodrag_firmware_*.bin
            build/bootloader/bootloader.bin
            build/partition_table/partition-table.bin
            build/flash_args
          retention-days: 30

      - name: Create release on tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/aerodrag_firmware_*.bin
            build/bootloader/bootloader.bin
            build/partition_table/partition-table.bin
