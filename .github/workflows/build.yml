name: Build firmware

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Build with ESP-IDF
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v6.0.1
          target: esp32s3
          path: '.'
          command: idf.py fullclean; idf.py build && cp build/aerodrag_firmware.bin build/aerodrag_firmware_$(git rev-parse --short HEAD).bin

      - name: Upload firmware binary
        uses: actions/upload-artifact@v4
        with:
          name: aerodrag-firmware
          path: |
            build/aerodrag_firmware.bin
            build/aerodrag_firmware_*.bin
            build/bootloader/bootloader.bin
            build/partition_table/partition-table.bin
            build/flash_args
          retention-days: 30

      - name: Create release on tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/aerodrag_firmware_*.bin
            build/bootloader/bootloader.bin
            build/partition_table/partition-table.bin
